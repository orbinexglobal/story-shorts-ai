# StoryShorts AI — default configuration
# Every tunable value for the pipeline lives here. Nothing should be
# hardcoded in application code; modules read their settings through
# config.settings.Config instead.

project:
  name: "StoryShorts AI"
  environment: "production"   # "production" or "test"

schedule:
  # The GitHub Actions workflow triggers ~12 times a day; each run uploads up
  # to `shorts_per_day` Shorts and stops once the daily target is reached.
  # 1-2 spaced uploads/day is deliberate: the Aug 2026 analytics export proved
  # that ~10/day dumps throttle the algorithm (each Short in a flood gets a
  # tiny test pool), while a couple of spread-out Shorts per day keep every
  # upload in the feed's rotation.
  shorts_per_day: 1          # how many Shorts to make per run
  daily_upload_target: 2    # stop uploading once this many Shorts are live today

story:
  # Retention window. The ~25-28s Shorts averaged ~40% viewed (≈10-11s watch),
  # which caps a Short below the ~65%+ threshold YouTube needs to scale it.
  # A 14-20s narration keeps the same real watch time (~10-11s) while pushing
  # % viewed into the 60-70% range, so the algorithm keeps promoting it.
  min_seconds: 14
  max_seconds: 20
  language: "en"
  tone: "reddit_storytime"
  candidates_per_run: 2        # generate 2 stories, score them, keep the best (quality beats luck)
  min_acceptable_score: 7.0    # out of 10; below this, discard and retry

ai_providers:
  # Order matters: first provider tried first, falls back down the list.
  fallback_order:
    - "openrouter"
    - "groq"
    - "gemini"
  max_retries_per_provider: 2
  retry_backoff_seconds: 5

  gemini:
    preferred_models:
      - "gemini-2.5-flash"
      - "gemini-2.0-flash"

  openrouter:
    # Free-tier slugs on OpenRouter change often (the provider re-checks the
    # live /api/v1/models list at startup and silently drops any slug that
    # OpenRouter no longer serves — dead slugs only ever 404). preferred_models
    # is the ordered list we try first; fallback_models adds extra valid models
    # to draw from if every preferred slug goes stale.
    auto_discover: true
    discovery_timeout_seconds: 5
    preferred_models:
      - "z-ai/glm-5.2:free"
      - "qwen/qwen3.8-27b:free"
      - "google/gemma-4-31b-it:free"
      - "google/gemma-4-26b-a4b-it:free"
      - "poolside/laguna-s-2.1:free"
      - "poolside/laguna-xs-2.1:free"
      - "nvidia/nemotron-3-super-120b-a12b:free"
      - "nvidia/nemotron-3-ultra-550b-a55b:free"
    fallback_models:
      - "nvidia/nemotron-3.5-lightning:free"
      - "thinkingmachines/inkling:free"

  groq:
    preferred_models:
      - "llama-3.1-8b-instant"
      - "llama-3.3-70b-versatile"

tts:
  primary_provider: "edge_tts"    # free, no key, best quality; gemini fallback below
  fallback_provider: "gemini"
  # Voice names differ per provider. `voice` is the Edge TTS name
  # (e.g. "en-US-ChristopherNeural", see: edge-tts --list-voices).
  voice: "en-US-ChristopherNeural"
  # `gemini_voice` is the Gemini TTS star-name voice (e.g. "kore",
  # "zephyr", "aoede", "charon"). Used only by Gemini TTS.
  gemini_voice: "kore"
  speaking_rate: 0.95

video:
  resolution: [1080, 1920]
  fps: 30
  audio_codec: "aac"
  video_codec: "h264"
  render_preset: "veryfast"     # x264 preset; faster = quicker renders
  max_duration_seconds: 60
  gameplay_dir: "assets/gameplay"
  music_dir: "assets/music"
  font_dir: "assets/fonts"
  avoid_repeat_gameplay: true
  music_volume_db: -18
  music_fade_seconds: 2

subtitles:
  words_per_group: 2
  font_size: 62
  font_color: "white"
  outline_color: "black"
  # Karaoke style: one sentence at a time, spoken word in highlight colour.
  highlight_color: "yellow"    # current word colour while it's spoken

youtube:
  visibility: "public"          # "public", "unlisted", or "private"
  category_id: "24"             # Entertainment
  default_language: "en"
  made_for_kids: false

logging:
  level: "INFO"             # console only; no log files are written

rate_limits:
  # Requests per minute per provider, used to stay under free-tier caps.
  requests_per_minute:
    gemini: 5               # gemini-2.5-flash free tier
    openrouter: 10          # free-model daily caps are handled by the chain
    groq: 30
  rate_limit_backoff_seconds: 30  # extra wait after an HTTP 429

retry:
  max_retries: 3
  backoff_seconds: 5
