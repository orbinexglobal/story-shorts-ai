name: StoryShorts AI Pipeline

on:
  schedule:
    # ~12 sessions/day, weighted toward Indian peak hours. Research on Indian
    # gaming/entertainment Shorts shows the strongest window is 7-11 PM IST
    # (gaming peaks ~7-10 PM IST), so most sessions fall just BEFORE the peak
    # so the algorithm indexes each Short before the traffic surge hits.
    # Sessions are spaced 45-60 min apart in the evening to avoid batch-dump
    # throttling (multiple uploads minutes apart get starved — see Aug 7 data).
    # Times below are UTC; add 5:30 for IST.
    #   05:00 UTC = 10:30 IST   (morning browse)
    #   08:00 UTC = 13:30 IST   (lunch break)
    #   10:00 UTC = 15:30 IST   (afternoon)
    #   11:00 UTC = 16:30 IST   (after-school ramp)
    #   12:00 UTC = 17:30 IST   (early evening)
    #   12:45 UTC = 18:15 IST   (evening)
    #   13:30 UTC = 19:00 IST   (peak — gaming window opens)
    #   14:15 UTC = 19:45 IST   (peak)
    #   15:00 UTC = 20:30 IST   (peak)
    #   15:45 UTC = 21:15 IST   (peak)
    #   16:30 UTC = 22:00 IST   (late peak)
    #   22:15 UTC = 03:45 IST   (final catch-up to top up to 10)
    - cron: "0 5 * * *"
    - cron: "0 8 * * *"
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
    - cron: "45 12 * * *"
    - cron: "30 13 * * *"
    - cron: "15 14 * * *"
    - cron: "0 15 * * *"
    - cron: "45 15 * * *"
    - cron: "30 16 * * *"
    - cron: "15 22 * * *"
  workflow_dispatch: {}   # allows manually triggering a run from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # to persist state/daily_upload_count.json between runs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Each run uploads up to ONE Short, then checks today's total via the
      # YouTube Data API (falling back to the committed state file) and stops
      # once 10 are live. The final run of the day uses a bigger count as a
      # catch-up: the --target 10 cap guarantees it never exceeds 10 total.
      - name: Run pipeline (1 short, cap at 10/day)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          HOUR=$(date -u +%H)
          SLOT=$((10#$HOUR / 2 % 7))
          # 22:xx UTC is the last session of the day: top up to the target.
          if [ "$HOUR" = "22" ]; then
            COUNT=10
          else
            COUNT=1
          fi
          echo "UTC hour $HOUR -> slot $SLOT, count $COUNT"
          python main.py --count "$COUNT" --target 10 --slot "$SLOT"

      - name: Persist daily count between runs
        run: |
          git config user.name "StoryShorts AI"
          git config user.email "storyshorts@users.noreply.github.com"
          git add state/daily_upload_count.json
          git diff --cached --quiet || git commit -m "Update daily upload count"
          git push

